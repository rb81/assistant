# =============================================================================
# Assistant — Application Configuration
# =============================================================================
#
# This tracked file contains all operational defaults. Edit it directly, or
# through the macOS client's reviewed source editor, for core behavior changes.
# Changed source requires rebuilding application images. The client keeps the
# last three versions; credentials belong in the credential store, not here.
#
# Settings can be overridden through setup or data/overrides.env.
# See docs/env-overrides.md for the complete list of available overrides.
#
# Override precedence (highest wins):
#   1. Compose environment, then data/overrides.env
#   2. This source file, baked into the application images
#   3. Code-level fallback defaults (matching the shipped source defaults)
#
# =============================================================================

agent:
  app:
    name: assistant
    referer_url: https://github.com/rb81/assistant
    timezone: UTC

  # Agent identity — override via AGENT_IDENTITY_NAME / AGENT_IDENTITY_EMAIL env vars.
  # When blank, name defaults to capitalized app name ("Assistant") and
  # email is derived from AGENT_EMAIL_SMTP_FROM → AGENT_EMAIL_SMTP_USERNAME → "assistant@local".
  identity:
    name:
    email:
    # Domain for generated Message-IDs; blank derives it from the agent address.
    message_id_domain:

  # Admin contact — override via AGENT_ADMIN_NAME / AGENT_ADMIN_EMAIL env vars.
  admin:
    name:
    email:

  # Organization details — override via AGENT_ORG_NAME / AGENT_ORG_SECURITY_EMAIL /
  # AGENT_ORG_INTERNAL_EMAIL_DOMAINS env vars.
  org:
    name:
    security_email:
    internal_email_domains: []

  database:
    host: postgres
    port: 5432
    name: assistant
    user: assistant
    # Credentials (secret: true in agent.schema.yaml): stored by setup, never in this file.
    password:
    url:

  providers:
    # Providers require explicit enablement, even when credentials are configured.
    enabled: []
    # Retained for compatibility with existing explicit exclusions.
    disabled: []
    # Optional ordering in provider selectors; this does not change model routes.
    priority: []
    openrouter_base_url: https://openrouter.ai/api/v1
    openai_base_url: https://api.openai.com/v1
    anthropic_base_url: https://api.anthropic.com
    gemini_base_url: https://generativelanguage.googleapis.com/v1beta
    cloudflare_base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    cloudflare_gateway_id: default
    openai_compatible_base_url:
    openai_compatible_api_key:
    cloudflare_account_id:

  llm:
    provider: auto
    model: anthropic/claude-sonnet-4.6
    fallback_model: openai/gpt-5.4
    base_url: https://openrouter.ai/api/v1
    zdr_only: false
    allowed_providers: []
    zdr_verified_providers: []
    zdr_verified_models: []
    temperature: 0.2
    max_tokens_per_call: 4096
    openrouter_api_key:
    openai_api_key:
    anthropic_api_key:
    gemini_api_key:
    cloudflare_api_key:

  model_routes:
    task:
      provider: inherit
      fallbacks: []
    naming:
      provider: inherit
      fallbacks: []
    routing:
      provider: inherit
      fallbacks: []
    summarization:
      provider: inherit
      fallbacks: []
    memory:
      provider: inherit
      fallbacks: []
    research:
      provider: inherit
      fallbacks: []
    research_search:
      provider: openrouter
      fallbacks: []
    web_search:
      provider: openrouter
      fallbacks: []
    fusion:
      provider: openrouter
    development:
      provider: inherit
      fallbacks: []
    speech:
      provider: openrouter

  model_service:
    enabled: false
    zdr_only: false
    budget_usd: 5.0
    budget_period_days: 30

  tts:
    enabled: false
    zdr_only: false
    model: mistralai/voxtral-mini-tts-3-0
    voice: gb_jane_confident

  approvals:
    channel: email

  naming:
    model: openai/gpt-4.1-mini

  routing:
    model: openai/gpt-4.1-mini
    timeout_seconds: 20
    fallback_continue_minutes: 180

  limits:
    max_iterations_per_task: 50
    max_tokens_per_task: 1000000
    message_history_window: 8
    max_prompt_chars: 400000
    summarization_model: openai/gpt-4.1-mini
    summarization_max_tokens: 2000
    summarization_timeout_seconds: 30
    summarization_keep_recent: 6
    summarization_max_input_chars: 80000
    tool_timeout_command_seconds: 300
    max_emails_per_hour: 10
    # Fraction of a limit at which the agent starts wrapping up.
    limit_approach_factor: 0.80
    rate_limit_backoff_seconds: 30
    poll_interval_seconds: 60

  task_agent:
    poll_interval_seconds: 2

  # Email account settings — override credentials and hosts via IMAP_* / SMTP_*
  # env vars. Operational defaults (folders, limits, behavior) can stay here.
  email:
    imap_host:
    imap_port: 993
    imap_username:
    imap_password:
    imap_folder: INBOX
    imap_archive_folder: Archive
    # Rejected, held and unaccepted inbound email is moved here and not stored.
    imap_quarantine_folder: Quarantine
    imap_sent_folder: Sent
    imap_poll_interval_seconds: 60
    imap_timeout_seconds: 60
    read_max_body_chars: 20000
    read_max_body_lines: 200
    smtp_host:
    smtp_port: 587
    smtp_username:
    smtp_password:
    smtp_from:
    save_to_sent: true
    max_attachment_count: 5
    max_attachment_bytes: 10485760
    max_total_attachment_bytes: 20971520
    allowed_recipient_domains: []
    context_body_preview_chars: 600
    initial_context_prior_full_body_char_limit: 1200
    max_initial_context_body_chars: 20000
    actionable_senders: []

  zoom:
    enabled: false
    # s2s or oauth; blank selects s2s when account_id is set, otherwise oauth.
    auth_mode:
    client_id:
    client_secret:
    account_id:
    refresh_token:
    user_id: me

  dropbox:
    enabled: false
    client_id:
    refresh_token:
    allow_exports: false
    max_file_bytes: 26214400

  telegram:
    enabled: false
    bot_token:
    allowed_user_ids: []
    recipients: {}
    max_download_bytes: 20971520
    max_messages_per_hour: 120
    show_task_status: false

  transcription:
    enabled: false
    base_url: http://transcription:8080
    api_token:
    language: auto
    model_path: /models/ggml-small.bin
    threads: 2

  supervisor:
    stall_threshold_minutes: 15
    max_task_duration_minutes: 60
    email_approval_increase_factor: 1.2

  filesystem:
    shared_root: /data/share
    require_mount: true
    shared_file_umask: "0002"
    max_read_bytes: 102400
    trash_directory: /data/share/.trash

  tool_result_cache:
    enabled: true
    root: .assistant/cache/tool-results
    min_bytes: 4096
    retention_days: 7

  artifacts:
    enabled: true
    raw_root: /data/private/artifacts
    processed_root: processed
    max_attachment_bytes: 26214400
    allowed_attachment_extensions:
      - .csv
      - .docx
      - .epub
      - .htm
      - .html
      - .json
      - .md
      - .pdf
      - .pptx
      - .txt
      - .xls
      - .xlsx
      - .xml
    clamav:
      enabled: true
      required: true
      host: clamav
      port: 3310
      timeout_seconds: 30

  prompt:
    agent_file: AGENT.md
    max_context_file_bytes: 65536

  skills:
    enabled: true
    allow_assistant_writes: false

  memory:
    working_context_days: 14
    keyword_min_match: 0.5
    steward:
      enabled: true
      model: openai/gpt-4.1-mini
      mode: best_effort
      timeout_seconds: 45
      max_tokens_per_call: 1600
      max_injected_memories: 8
      max_writes_per_job: 5
      max_transcript_bytes: 30000
      min_importance: 4
      min_confidence: 0.55
      max_memory_chars: 500
      reap_after_days: 90
      reap_max_importance: 2
      reap_interval_hours: 24
      conflict_detection_enabled: true
      conflict_similarity_threshold: 0.85
    embeddings:
      min_similarity: 0.45
      recency_boost_max: 0.1
      recency_boost_days: 365
      candidate_limit: 500

  context:
    enabled: true
    search_days: 90
    embedding_text_limit: 1500
    keyword_boost: 0.25
    max_results_per_source: 5
    min_score: 0.20
    steward_max_candidates: 10

  embeddings:
    enabled: true
    base_url: http://ollama:11434
    model: embeddinggemma
    dimensions:
    timeout_seconds: 20

  workspace:
    max_conversion_bytes: 26214400
    normalize_documents: true
    source_archive_root: .assistant/archive/source-documents
    # Blank uses the built-in list of text file extensions.
    text_extensions: []
    convertible_document_extensions:
      - .doc
      - .docx
      - .odp
      - .ods
      - .odt
      - .pdf
      - .ppt
      - .pptx
      - .xls
      - .xlsm
      - .xlsx
    index:
      enabled: true
      poll_interval_seconds: 60
      chunk_chars: 3500
      candidate_limit: 3000

  conversion:
    pandoc_path: pandoc
    pdf_engine: weasyprint
    timeout_seconds: 120
    max_input_bytes: 26214400

  reminders:
    scheduler_poll_interval_seconds: 2
    max_due_per_tick: 25
    script_check_interval_minutes: 360

  calendar:
    enabled: false
    # Default provider when not specified per-call (google, outlook, or zoho).
    # Override via AGENT_CALENDAR_DEFAULT_PROVIDER env var.
    default_provider:
    # Default reminder alert in minutes before an event. Override via
    # AGENT_CALENDAR_DEFAULT_ALERT_MINUTES env var.
    default_alert_minutes: 30
    policy:
      allow_read_event_details: false
    # Provider-specific settings. Configure OAuth credentials through setup;
    # calendar_id and regional options can be set here or overridden via env vars.
    google:
      calendar_id: primary
      client_id:
      client_secret:
      refresh_token:
    outlook:
      calendar_id:
      tenant_id: common
      client_id:
      client_secret:
      refresh_token:
    zoho:
      calendar_id:
      api_base:
      client_id:
      client_secret:
      refresh_token:

  deep_research:
    enabled: true
    model:
    search_model: perplexity/sonar-pro
    max_tool_calls: 40
    max_iterations: 30
    poll_interval_seconds: 2
    timeout_seconds: 180

  client:
    poll_interval_seconds: 15
    availability_timeout_seconds: 60
    delivery_timeout_seconds: 60
    reconciliation_interval_seconds: 15
    retry_interval_seconds: 60
    claim_timeout_seconds: 3600

  heartbeat:
    enabled: true
    poll_interval_seconds: 300
    stale_threshold_minutes: 30
    deep_research_stale_minutes: 60
    admin_digest_interval_hours: 0

  sandbox:
    enabled: true
    base_url: https://sandbox:8080
    api_token:
    revoke_token:
    max_attempts: 3
    retry_backoff_seconds: 1
    network:
      # Deprecated/inactive global allowlist; script execution uses per-version host approval.
      # Legacy configuration remains loadable; network block settings remain effective.
      allowed_hosts: []

  search:
    enabled: true
    openrouter_enabled: true
    exa_enabled: false
    primary_provider: openrouter
    exa_api_key:
    model: openai/gpt-4.1-mini
    engine: auto
    max_results: 5
    max_total_results: 15
    max_tokens: 3000
    timeout_seconds: 90
    search_context_size: medium
    allowed_domains: []
    excluded_domains: []

  web_fetch:
    enabled: false
    base_url:
    api_token:
    managed_token:
    timeout_seconds: 35
    inline_chars: 3500

  fusion:
    enabled: true
    analysis_models: []
    model:
    max_tool_calls: 8
    max_completion_tokens:
    temperature:

  # Optional admin sender authentication and decision-model screening; configure with ./run.sh.
  # See docs/security.md#email-and-action-screening.
  security:
    notify_max_per_hour: 20
    # YOLO mode: possibly malicious email may proceed without review; script permissions remain mandatory.
    allow_possibly_malicious: false
    # Independent opt-in: scripts + public network run without approvals/supervisor.
    # Existing sandbox/network/credential/filesystem safety restrictions still apply.
    script_yolo: false
    development:
      # Blank reuses agent.llm provider/model and its existing credential.
      # Use an OpenRouter provider/model ID to select another model (AGENT_LLM_OPENROUTER_API_KEY).
      # Presets are not used; the supervisor has its own instructions.
      model: ""
      max_minutes: 30
      max_runs: 20
    # Confirm fresh admin task emails only; established replies and continuations proceed without confirmation.
    # Does not disable sender authentication, content screening or privileged-action approvals.
    confirm_new_admin_conversations: true
    email_authentication:
      # Required for email whose From is the admin address (tasks, /admin commands, OTP replies).
      # Also supplies evidence for non-admin decision-model screening; it does not gate those senders.
      # Verified via DNS: an aligned DKIM signature or an aligned SPF pass is required.
      # Recommended; disable only if your admin mail provider cannot pass DKIM or SPF.
      enabled: true
    decision_model:
      # When enabled, all accepted inbound task email (including admin email) is screened.
      enabled: false
      # openrouter (default): OpenRouter's normalized Decisions API with AGENT_LLM_OPENROUTER_API_KEY; model is any
      # decision model slug (default perplexity/pplx-decider-v1.2).
      # Optional direct provider APIs (AGENT_SECURITY_DECISION_MODEL_API_KEY): perplexity, jev, clef, openai, or custom
      # (System One-compatible endpoint; set url and model).
      provider: openrouter
      url:
      model:
      api_key:
      timeout_seconds: 20
      # review (hold for admin), reject, or allow when the decision model is unavailable
      on_error: review
      approval_ttl_minutes: 1440
      malicious_threshold: 0.7
      possibly_malicious_threshold: 0.3
      flag_threshold: 0.5
      max_field_chars: 40000
      screen:
        outbound_email: false
        scripts: false
    scripts:
      # Hosts scripts may contact without review (blank = no allowlist); subdomains match.
      allowed_domains: []
      max_files: 20
