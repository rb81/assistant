# =============================================================================
# Assistant — Application Configuration
# =============================================================================
#
# This tracked file contains all operational defaults. You should not need to
# edit it for normal deployments. Setup copies it to data/config/agent.yaml;
# configure credentials and identity through ./setup.sh.
#
# Settings can be overridden through setup or data/overrides.env.
# See docs/env-overrides.md for the complete list of available overrides.
#
# Override precedence (highest wins):
#   1. Environment variable (from data/.env and data/overrides.env via Compose)
#   2. Local configuration (data/config/agent.yaml)
#   3. Code-level fallback defaults
#
# =============================================================================

agent:
  app:
    name: assistant
    referer_url: https://github.com/rb81/assistant
    timezone: UTC

  # Agent identity — override via AGENT_NAME / AGENT_EMAIL env vars.
  # When blank, name defaults to capitalized app name ("Assistant") and
  # email is derived from SMTP_FROM → SMTP_USERNAME → "assistant@local".
  identity:
    name:
    email:

  # Admin contact — override via ADMIN_NAME / ADMIN_EMAIL env vars.
  admin:
    name:
    email:

  # Organization details — override via ORG_NAME / ORG_SECURITY_EMAIL /
  # ORG_INTERNAL_EMAIL_DOMAINS env vars.
  org:
    name:
    security_email:
    internal_email_domains: []

  database:
    host: postgres
    port: 5432
    name: assistant
    user: assistant

  llm:
    model: anthropic/claude-sonnet-4.6
    fallback_model: openai/gpt-5.4
    base_url: https://openrouter.ai/api/v1
    temperature: 0.2
    max_tokens_per_call: 4096

  model_service:
    enabled: false
    budget_usd: 5.0
    budget_period_days: 30

  limits:
    max_iterations_per_task: 50
    max_tokens_per_task: 1000000
    message_history_window: 8
    max_prompt_chars: 400000
    summarization_model: openai/gpt-4.1-mini
    summarization_max_tokens: 2000
    summarization_timeout_seconds: 30
    summarization_keep_recent: 6
    summarization_max_input_chars: 80000
    tool_timeout_command_seconds: 300
    max_emails_per_hour: 10
    poll_interval_seconds: 60

  task_agent:
    poll_interval_seconds: 2

  # Email account settings — override credentials and hosts via IMAP_* / SMTP_*
  # env vars. Operational defaults (folders, limits, behavior) can stay here.
  email:
    imap_host:
    imap_port: 993
    imap_username:
    imap_password:
    imap_folder: INBOX
    imap_archive_folder: Archive
    # Rejected, held and unaccepted inbound email is moved here and not stored.
    imap_quarantine_folder: Quarantine
    imap_sent_folder: Sent
    imap_poll_interval_seconds: 60
    smtp_host:
    smtp_port: 587
    smtp_username:
    smtp_password:
    smtp_from:
    save_to_sent: true
    max_attachment_count: 5
    max_attachment_bytes: 10485760
    max_total_attachment_bytes: 20971520
    allowed_recipient_domains: []
    context_body_preview_chars: 600
    initial_context_prior_full_body_char_limit: 1200
    max_initial_context_body_chars: 20000
    actionable_senders: []
    subject_threading_fallback: false

  dropbox:
    enabled: false
    client_id:
    refresh_token:
    allow_exports: false
    max_file_bytes: 26214400

  telegram:
    enabled: false
    bot_token:
    allowed_user_ids: []
    recipients: {}
    max_download_bytes: 20971520
    max_messages_per_hour: 120

  transcription:
    enabled: false
    base_url: http://transcription:8080
    api_token:
    language: auto

  supervisor:
    stall_threshold_minutes: 15
    max_task_duration_minutes: 60

  filesystem:
    shared_root: /data/share
    require_mount: true
    shared_file_umask: "0002"
    max_read_bytes: 102400
    trash_directory: /data/share/.trash

  tool_result_cache:
    enabled: true
    root: .assistant/cache/tool-results
    min_bytes: 4096
    retention_days: 7

  artifacts:
    enabled: true
    raw_root: /data/private/artifacts
    processed_root: processed
    max_attachment_bytes: 26214400
    allowed_attachment_extensions:
      - .csv
      - .docx
      - .epub
      - .htm
      - .html
      - .json
      - .md
      - .pdf
      - .pptx
      - .txt
      - .xls
      - .xlsx
      - .xml
    clamav:
      enabled: true
      required: true
      host: clamav
      port: 3310
      timeout_seconds: 30

  prompt:
    agent_file: AGENT.md
    max_context_file_bytes: 65536

  memory:
    working_context_days: 14
    steward:
      enabled: true
      model: openai/gpt-4.1-mini
      mode: best_effort
      timeout_seconds: 45
      max_tokens_per_call: 1600
      max_injected_memories: 8
      max_writes_per_job: 5
      max_transcript_bytes: 30000
      min_importance: 4
      min_confidence: 0.55
      reap_after_days: 90
      reap_max_importance: 2
      reap_interval_hours: 24
      conflict_detection_enabled: true
      conflict_similarity_threshold: 0.85
    embeddings:
      min_similarity: 0.45
      recency_boost_max: 0.1
      recency_boost_days: 365

  context:
    search_days: 90

  embeddings:
    enabled: true
    base_url: http://ollama:11434
    model: embeddinggemma
    dimensions:
    timeout_seconds: 20

  workspace:
    max_conversion_bytes: 26214400
    convertible_document_extensions:
      - .doc
      - .docx
      - .odp
      - .ods
      - .odt
      - .pdf
      - .ppt
      - .pptx
      - .xls
      - .xlsm
      - .xlsx
    index:
      enabled: true
      poll_interval_seconds: 60
      chunk_chars: 3500
      candidate_limit: 3000

  conversion:
    pandoc_path: pandoc
    pdf_engine: weasyprint
    timeout_seconds: 120
    max_input_bytes: 26214400

  reminders:
    default_timezone:
    scheduler_poll_interval_seconds: 2
    max_due_per_tick: 25

  calendar:
    enabled: false
    timezone:
    # Default provider when not specified per-call (google, outlook, or zoho).
    # Override via CALENDAR_DEFAULT_PROVIDER env var.
    default_provider:
    # Default reminder alert in minutes before an event. Override via
    # CALENDAR_DEFAULT_ALERT_MINUTES env var.
    default_alert_minutes: 30
    policy:
      allow_read_event_details: false
    # Provider-specific settings. Configure OAuth credentials through setup;
    # calendar_id and regional options can be set here or overridden via env vars.
    google:
      calendar_id:
    outlook:
      calendar_id:
      tenant_id:
    zoho:
      calendar_id:
      api_base:

  deep_research:
    enabled: true
    model:
    search_model: perplexity/sonar-pro
    max_tool_calls: 40
    max_iterations: 30
    poll_interval_seconds: 2
    timeout_seconds: 180

  heartbeat:
    enabled: true
    poll_interval_seconds: 300
    stale_threshold_minutes: 30
    deep_research_stale_minutes: 60
    admin_digest_interval_hours: 0

  sandbox:
    enabled: true
    base_url: https://sandbox:8080
    max_attempts: 3
    retry_backoff_seconds: 1

  search:
    enabled: true
    model: openai/gpt-4.1-mini
    engine: auto
    max_results: 5
    max_total_results: 15
    search_context_size: medium
    allowed_domains: []
    excluded_domains: []

  fusion:
    enabled: true
    analysis_models: []
    model:
    max_tool_calls: 8
    max_completion_tokens:
    temperature:

  # Optional admin sender authentication and decision-model screening; configure with ./setup.sh.
  # See docs/security.md#email-and-action-screening.
  security:
    notify_max_per_hour: 20
    # YOLO mode: let "possibly malicious" items proceed without admin approval (malicious is always blocked).
    allow_possibly_malicious: false
    email_authentication:
      # Applies only to email whose From is the admin address (tasks, /admin commands, OTP replies).
      # Verified via DNS: an aligned DKIM signature or an aligned SPF pass is required.
      enabled: false
    decision_model:
      # When enabled, all accepted non-admin inbound email is always screened.
      enabled: false
      # openrouter (default): OpenRouter's normalized Decisions API with OPENROUTER_API_KEY; model is any
      # decision model slug (default perplexity/pplx-decider-v1.2).
      # Optional direct provider APIs (SECURITY_DECISION_API_KEY): perplexity, jev, clef, openai, or custom
      # (System One-compatible endpoint; set url and model).
      provider: openrouter
      url:
      model:
      timeout_seconds: 20
      # review (hold for admin), reject, or allow when the decision model is unavailable
      on_error: review
      approval_ttl_minutes: 1440
      malicious_threshold: 0.7
      possibly_malicious_threshold: 0.3
      flag_threshold: 0.5
      max_field_chars: 40000
      screen:
        outbound_email: false
        scripts: false
    scripts:
      # Hosts scripts may contact without review (blank = no allowlist); subdomains match.
      allowed_domains: []
      max_files: 20
