name: assistant

x-agent-secrets: &agent-secrets
  AGENT_NAME: ${AGENT_NAME:-}
  AGENT_EMAIL: ${AGENT_EMAIL:-}
  ADMIN_NAME: ${ADMIN_NAME:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ORG_NAME: ${ORG_NAME:-}
  ORG_SECURITY_EMAIL: ${ORG_SECURITY_EMAIL:-}
  ORG_INTERNAL_EMAIL_DOMAINS: ${ORG_INTERNAL_EMAIL_DOMAINS:-}
  AGENT_TIMEZONE: ${AGENT_TIMEZONE:-}
  AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
  AGENT_LLM_FALLBACK_MODEL: ${AGENT_LLM_FALLBACK_MODEL:-}
  AGENT_MAX_EMAILS_PER_HOUR: ${AGENT_MAX_EMAILS_PER_HOUR:-}
  AGENT_IMAP_POLL_INTERVAL: ${AGENT_IMAP_POLL_INTERVAL:-}
  CALENDAR_ENABLED: ${CALENDAR_ENABLED:-}
  CALENDAR_TIMEZONE: ${CALENDAR_TIMEZONE:-}
  CALENDAR_DEFAULT_PROVIDER: ${CALENDAR_DEFAULT_PROVIDER:-}
  CALENDAR_DEFAULT_ALERT_MINUTES: ${CALENDAR_DEFAULT_ALERT_MINUTES:-}
  CALENDAR_GOOGLE_CALENDAR_ID: ${CALENDAR_GOOGLE_CALENDAR_ID:-primary}
  CALENDAR_OUTLOOK_TENANT_ID: ${CALENDAR_OUTLOOK_TENANT_ID:-common}
  CALENDAR_ZOHO_API_BASE: ${CALENDAR_ZOHO_API_BASE:-}
  IMAP_HOST: ${IMAP_HOST:-}
  IMAP_PORT: ${IMAP_PORT:-993}
  IMAP_USERNAME: ${IMAP_USERNAME:-}
  IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
  IMAP_ARCHIVE_FOLDER: ${IMAP_ARCHIVE_FOLDER:-Archive}
  IMAP_QUARANTINE_FOLDER: ${IMAP_QUARANTINE_FOLDER:-Quarantine}
  IMAP_SENT_FOLDER: ${IMAP_SENT_FOLDER:-Sent}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_FROM: ${SMTP_FROM:-}
  EMAIL_ALLOWED_RECIPIENT_DOMAINS: ${EMAIL_ALLOWED_RECIPIENT_DOMAINS:-}
  EMAIL_ACTIONABLE_SENDERS: ${EMAIL_ACTIONABLE_SENDERS:-}

x-agent-config-volume: &agent-config-volume
  type: bind
  source: ../data/config
  target: /app/config
  read_only: true
  bind:
    create_host_path: false

x-docs-volume: &docs-volume
  type: bind
  source: ../docs
  target: /data/share/.assistant/docs
  read_only: true
  bind:
    create_host_path: false

x-postgres-tls-volume: &postgres-tls-volume
  type: bind
  source: ../data/private/tls/postgres.crt
  target: /run/assistant/tls/postgres.crt
  read_only: true
  bind:
    create_host_path: false

x-sandbox-tls-volume: &sandbox-tls-volume
  type: bind
  source: ../data/private/tls/sandbox.crt
  target: /run/assistant/tls/sandbox.crt
  read_only: true
  bind:
    create_host_path: false

x-agent-common: &agent-common
  build: ./agent
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - NET_RAW
  env_file:
    - path: ../data/.env
    # Hand-edited overrides; keys set in an environment: block below still take precedence.
    - path: ../data/overrides.env
      required: false
  environment:
    <<: *agent-secrets
    AGENT_CONFIG: /app/config/agent.yaml
  volumes:
    - *agent-config-volume
    - *docs-volume
    - *postgres-tls-volume
    - *sandbox-tls-volume
  networks:
    - database_net
    - egress_net

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p "$${PGDATA}"
        install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/tls
        install -o postgres -g postgres -m 0644 /run/assistant/tls/postgres.crt /var/lib/postgresql/tls/server.crt
        install -o postgres -g postgres -m 0600 /run/assistant/tls/postgres.key /var/lib/postgresql/tls/server.key
        exec /usr/local/bin/docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/tls/server.crt -c ssl_key_file=/var/lib/postgresql/tls/server.key -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
      - type: bind
        source: ./database/schema.sql
        target: /docker-entrypoint-initdb.d/001_schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
        bind:
          create_host_path: false
      - *postgres-tls-volume
      - type: bind
        source: ../data/private/tls/postgres.key
        target: /run/assistant/tls/postgres.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "PGSSLMODE=verify-full PGSSLROOTCERT=/run/assistant/tls/postgres.crt pg_isready -h postgres -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - database_net

  clamav:
    image: clamav/clamav:stable_base
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ../data/clamav:/var/lib/clamav
    networks:
      - clamav_net
      - service_egress_net

  downloader:
    <<: *agent-common
    profiles: ["email"]
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      <<: *agent-secrets
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: downloader
    volumes:
      - ../data/share:/data/share
      - *docs-volume
      - ../data/private/artifacts:/data/private/artifacts
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - clamav_net
      - transcription_net
      - egress_net
      - sandbox_net

  task-agent:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      <<: *agent-secrets
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: task-agent
    volumes:
      - ../data/share:/data/share
      - *docs-volume
      - ../data/private/artifacts/dropbox:/data/private/artifacts/dropbox
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - model_net
      - clamav_net
      - egress_net
      - sandbox_net
    deploy:
      replicas: ${TASK_AGENT_WORKERS:-1}

  workspace-indexer:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      <<: *agent-secrets
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: workspace-indexer
    volumes:
      - ../data/share:/data/share
      - *docs-volume
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - model_net
      - egress_net

  reminder-scheduler:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *agent-secrets
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: reminder-scheduler
    networks:
      - database_net
      - egress_net

  telegram-receiver:
    <<: *agent-common
    profiles: ["telegram"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: telegram-receiver
    networks:
      - database_net
      - egress_net
      - sandbox_net

  request-preprocessor:
    <<: *agent-common
    profiles: ["telegram"]
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: request-preprocessor
    volumes:
      - ../data/share:/data/share
      - *docs-volume
      - ../data/private/artifacts:/data/private/artifacts
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - clamav_net
      - transcription_net
      - egress_net
    deploy:
      replicas: ${REQUEST_PREPROCESSOR_WORKERS:-1}

  transcription-init:
    image: assistant-transcription:local
    build: ./transcription
    profiles: ["voice"]
    user: "0:0"
    entrypoint: ["python", "bootstrap.py"]
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH", "CHOWN"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    pids_limit: 32
    mem_limit: 256m
    volumes:
      - whisper-models:/models
      - transcription-runtime:/runtime
    networks:
      - egress_net

  transcription:
    image: assistant-transcription:local
    build: ./transcription
    profiles: ["voice"]
    depends_on:
      transcription-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700"]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    environment:
      TRANSCRIPTION_API_TOKEN_FILE: /runtime/token
      WHISPER_THREADS: "2"
    volumes:
      - whisper-models:/models:ro
      - transcription-runtime:/runtime:ro
    networks:
      - transcription_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  deep-research-agent:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *agent-secrets
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: deep-research-agent
    volumes:
      - ../data/share:/data/share
      - *docs-volume
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - model_net
      - clamav_net
      - egress_net

  supervisor:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *agent-secrets
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: supervisor
    networks:
      - database_net
      - model_net
      - egress_net

  heartbeat:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *agent-secrets
      AGENT_CONFIG: /app/config/agent.yaml
      AGENT_ROLE: heartbeat
    networks:
      - database_net
      - model_net
      - clamav_net
      - egress_net

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ../data/ollama:/root/.ollama
    networks:
      - model_net
      - service_egress_net

  ollama-model-puller:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      AGENT_EMBEDDINGS_ENABLED: ${AGENT_EMBEDDINGS_ENABLED:-true}
      AGENT_EMBEDDINGS_MODEL: ${AGENT_EMBEDDINGS_MODEL:-${MEMORY_EMBEDDING_MODEL:-embeddinggemma}}
      AGENT_EMBEDDINGS_BASE_URL: ${AGENT_EMBEDDINGS_BASE_URL:-http://ollama:11434}
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        if [ "$$AGENT_EMBEDDINGS_ENABLED" != "true" ] || [ "$${AGENT_EMBEDDINGS_BASE_URL%/}" != "http://ollama:11434" ]; then
          echo "Managed model pull skipped: embeddings disabled or using a custom endpoint"
          exit 0
        fi
        attempt=1
        while [ "$$attempt" -le 60 ]; do
          if ollama list >/dev/null 2>&1; then
            exec ollama pull "$$AGENT_EMBEDDINGS_MODEL"
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        echo "Ollama did not become ready within 120 seconds" >&2
        exit 1
    networks:
      - model_net
      - egress_net

  # Production defaults for command execution:
  # - broker stays on sandbox_net only
  # - each command runs in a fresh container on its own bridge network
  # - run containers get the workspace, read-only harness docs, and HTTPS egress only via a
  #   per-run proxy sidecar that allows admin-approved hosts (SANDBOX_EGRESS_MODE=open restores direct internet)
  # Use a Compose override file to opt into gVisor/runsc after validating networking.
  sandbox-init:
    image: ${SANDBOX_IMAGE:-assistant-sandbox:latest}
    build: ./sandbox
    restart: "no"
    command: ["python", "bootstrap.py"]
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - type: bind
        source: ../data/private/tls/sandbox.crt
        target: /run/assistant/source/sandbox.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/private/tls/sandbox.key
        target: /run/assistant/source/sandbox.key
        read_only: true
        bind:
          create_host_path: false
      - sandbox-runtime:/run/assistant/runtime

  sandbox:
    image: ${SANDBOX_IMAGE:-assistant-sandbox:latest}
    build: ./sandbox
    restart: unless-stopped
    depends_on:
      sandbox-init:
        condition: service_completed_successfully
    environment:
      SANDBOX_SHARED_ROOT: /data/share
      SANDBOX_SHARED_ROOT_HOST: ${SANDBOX_SHARED_ROOT_HOST:?Run ./setup.sh first}
      SANDBOX_DOCS_ROOT_HOST: ${SANDBOX_DOCS_ROOT_HOST:?Run ./setup.sh first}
      SANDBOX_TLS_CERT_FILE: /run/assistant/runtime/current/sandbox.crt
      SANDBOX_TLS_KEY_FILE: /run/assistant/runtime/current/sandbox.key
      SANDBOX_API_TOKEN_FILE: /run/assistant/runtime/current/SANDBOX_API_TOKEN
      SANDBOX_ISOLATION_MODE: ${SANDBOX_ISOLATION_MODE:-container}
      SANDBOX_RUN_IMAGE: ${SANDBOX_IMAGE:-assistant-sandbox:latest}
      SANDBOX_RUN_NETWORK_MODE: ${SANDBOX_RUN_NETWORK_MODE:-per_run_bridge}
      SANDBOX_EGRESS_MODE: ${SANDBOX_EGRESS_MODE:-proxy}
      SANDBOX_RUN_CAP_DROP: ${SANDBOX_RUN_CAP_DROP:-NET_RAW}
      SANDBOX_RUN_CPUS: ${SANDBOX_RUN_CPUS:-2}
      SANDBOX_RUN_MEMORY_BYTES: ${SANDBOX_RUN_MEMORY_BYTES:-2147483648}
      SANDBOX_RUN_PIDS_LIMIT: ${SANDBOX_RUN_PIDS_LIMIT:-512}
      SHARED_FILE_UMASK: "0002"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,urllib.request; from pathlib import Path; root=Path('/run/assistant/runtime/current'); context=ssl.create_default_context(cafile=str(root/'sandbox.crt')); request=urllib.request.Request('https://sandbox:8080/health',headers={'Authorization':'Bearer '+(root/'SANDBOX_API_TOKEN').read_text().strip()}); response=urllib.request.urlopen(request,context=context,timeout=4); assert response.status == 200"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    mem_limit: 2g
    cpus: 2
    volumes:
      - ../data/share:/data/share
      - *docs-volume
      - sandbox-runtime:/run/assistant/runtime:ro
      # The Docker socket is required so the sandbox broker can create and
      # destroy ephemeral per-command containers for isolated execution.
      # This is a high-privilege mount — see docs/security.md for details.
      # To eliminate this exposure, set agent.sandbox.enabled: false in
      # config/agent.yaml (disables the command_execute tool entirely).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox_net

volumes:
  whisper-models:
  transcription-runtime:
  sandbox-runtime:

networks:
  transcription_net:
    internal: true
  database_net:
    internal: true
  model_net:
    internal: true
  clamav_net:
    internal: true
  egress_net:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  service_egress_net:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  sandbox_net:
    internal: true
