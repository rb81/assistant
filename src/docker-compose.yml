name: assistant

x-management-build: &management-build
  context: ..
  dockerfile: src/management/Dockerfile
  args:
    ASSISTANT_REVISION: ${ASSISTANT_REVISION:-unknown}

x-agent-config-volume: &agent-config-volume
  type: bind
  source: ../data/config
  target: /app/config
  read_only: true
  bind:
    create_host_path: false

x-postgres-tls-volume: &postgres-tls-volume
  type: bind
  source: ../data/private/tls/postgres.crt
  target: /run/assistant/tls/postgres.crt
  read_only: true
  bind:
    create_host_path: false

x-sandbox-tls-volume: &sandbox-tls-volume
  type: bind
  source: ../data/private/tls/sandbox.crt
  target: /run/assistant/tls/sandbox.crt
  read_only: true
  bind:
    create_host_path: false

x-agent-common: &agent-common
  build:
    context: ..
    dockerfile: src/agent/Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m
    - /run/assistant-health:rw,nosuid,nodev,noexec,size=1m,mode=0700
  healthcheck:
    test: ["CMD", "python", "-m", "assistant_agent.worker_health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 120s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - NET_RAW
  env_file:
    - path: ../data/.env
    # Settings (agent.yaml overrides) written by setup and the management API; an environment: block below still takes precedence.
    - path: ../data/overrides.env
      required: false
  volumes:
    - *agent-config-volume
    - *postgres-tls-volume
    - *sandbox-tls-volume
  networks:
    - database_net
    - egress_net

services:
  management-docker:
    image: ${ASSISTANT_MANAGEMENT_IMAGE:-assistant-management:local}
    build: *management-build
    command: ["python", "-m", "assistant_agent.management_docker"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 256m
    environment:
      ASSISTANT_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-assistant}
      ASSISTANT_INSTALL_ROOT: ${ASSISTANT_INSTALL_ROOT:?Use ./run.sh server start to prepare the installation}
      ASSISTANT_CONTAINER_ADMIN: "1"
      ASSISTANT_MANAGEMENT_EXECUTOR: "1"
      GOMAXPROCS: "2"
    volumes:
      - type: bind
        source: ${ASSISTANT_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: ${ASSISTANT_INSTALL_ROOT}
        target: ${ASSISTANT_INSTALL_ROOT}
        read_only: true
      - type: bind
        source: ${ASSISTANT_INSTALL_ROOT}/data
        target: ${ASSISTANT_INSTALL_ROOT}/data
        bind:
          create_host_path: false
      - type: bind
        source: ${ASSISTANT_INSTALL_ROOT}/src/config
        target: ${ASSISTANT_INSTALL_ROOT}/src/config
        bind:
          create_host_path: false
    networks:
      - management_net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; [socket.create_connection(('127.0.0.1', port), timeout=2).close() for port in (2375, 2376)]"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  management:
    image: ${ASSISTANT_MANAGEMENT_IMAGE:-assistant-management:local}
    build: *management-build
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    pids_limit: 128
    mem_limit: 512m
    depends_on:
      - management-docker
    environment:
      ASSISTANT_INSTALL_ROOT: ${ASSISTANT_INSTALL_ROOT:?Use ./run.sh server start to prepare the installation}
      ASSISTANT_MANAGEMENT_PORT: ${ASSISTANT_MANAGEMENT_PORT:-8765}
      ASSISTANT_UID: ${ASSISTANT_UID:-0}
      ASSISTANT_GID: ${ASSISTANT_GID:-0}
      ASSISTANT_CONTAINER_ADMIN: "1"
      ASSISTANT_CREDENTIAL_STORE: /run/assistant/credentials/store.json
      ASSISTANT_MANAGEMENT_EXECUTOR_URL: http://management-docker:2376
      ASSISTANT_MANAGEMENT_READER_URL: http://management-reader:8766
      DOCKER_HOST: tcp://management-docker:2375
    ports:
      - "127.0.0.1:${ASSISTANT_MANAGEMENT_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: ${ASSISTANT_INSTALL_ROOT}
        target: ${ASSISTANT_INSTALL_ROOT}
        read_only: true
      - type: bind
        source: ${ASSISTANT_INSTALL_ROOT}/data
        target: ${ASSISTANT_INSTALL_ROOT}/data
        bind:
          create_host_path: false
    networks:
      - management_net
      - management_access_net
    healthcheck:
      test: ["CMD", "python", "-m", "assistant_agent.management_server", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  management-reader:
    <<: *agent-common
    command: ["python", "-m", "assistant_agent.management_reader"]
    cap_drop: ["ALL"]
    # Read owner-only bind credentials as well as root-owned credential-volume grants.
    cap_add: ["DAC_OVERRIDE"]
    pids_limit: 64
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - *agent-config-volume
      - *postgres-tls-volume
      - type: bind
        source: ../data/.management-token
        target: /run/assistant/management-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/share
        target: /data/share
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database_net
      - management_net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; from assistant_agent.worker_health import database_ready; socket.create_connection(('127.0.0.1',8766),timeout=2).close(); assert database_ready()"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p "$${PGDATA}"
        install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/tls
        install -o postgres -g postgres -m 0644 /run/assistant/tls/postgres.crt /var/lib/postgresql/tls/server.crt
        install -o postgres -g postgres -m 0600 /run/assistant/tls/postgres.key /var/lib/postgresql/tls/server.key
        exec /usr/local/bin/docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/tls/server.crt -c ssl_key_file=/var/lib/postgresql/tls/server.key -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
      - type: bind
        source: ./database/schema.sql
        target: /docker-entrypoint-initdb.d/001_schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
        bind:
          create_host_path: false
      - *postgres-tls-volume
      - type: bind
        source: ../data/private/tls/postgres.key
        target: /run/assistant/tls/postgres.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "PGSSLMODE=verify-full PGSSLROOTCERT=/run/assistant/tls/postgres.crt pg_isready -h postgres -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - database_net

  clamav:
    image: clamav/clamav:stable_base
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - ../data/clamav:/var/lib/clamav
    networks:
      - clamav_net
      - service_egress_net

  downloader:
    <<: *agent-common
    profiles: ["email"]
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      AGENT_ROLE: downloader
    volumes:
      - ../data/share:/data/share
      - ../data/private/artifacts:/data/private/artifacts
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - clamav_net
      - transcription_net
      - egress_net
      - sandbox_net

  task-agent:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      AGENT_ROLE: task-agent
    volumes:
      - ../data/share:/data/share
      - ../data/private/artifacts/dropbox:/data/private/artifacts/dropbox
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - model_net
      - clamav_net
      - egress_net
      - sandbox_net
      - web_reader_control_net
    deploy:
      replicas: ${TASK_AGENT_WORKERS:-1}

  workspace-indexer:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      AGENT_ROLE: workspace-indexer
    volumes:
      - ../data/share:/data/share
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - model_net
      - egress_net

  reminder-scheduler:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_ROLE: reminder-scheduler
    networks:
      - database_net
      - egress_net

  telegram-receiver:
    <<: *agent-common
    profiles: ["telegram"]
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      AGENT_ROLE: telegram-receiver
    volumes:
      - ../data/private/artifacts/telegram:/data/private/artifacts/telegram
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - egress_net
      - sandbox_net
      - clamav_net
      - transcription_net

  request-preprocessor:
    <<: *agent-common
    profiles: ["telegram"]
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      AGENT_ROLE: request-preprocessor
    volumes:
      - ../data/share:/data/share
      - ../data/private/artifacts:/data/private/artifacts
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - clamav_net
      - transcription_net
      - egress_net
    deploy:
      replicas: ${REQUEST_PREPROCESSOR_WORKERS:-1}

  transcription-init:
    image: assistant-transcription:local
    build: ./transcription
    profiles: ["voice"]
    user: "0:0"
    entrypoint: ["python", "bootstrap.py"]
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH", "CHOWN"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    pids_limit: 32
    mem_limit: 256m
    volumes:
      - whisper-models:/models
      - transcription-runtime:/runtime
    networks:
      - egress_net

  transcription:
    image: assistant-transcription:local
    build: ./transcription
    profiles: ["voice"]
    depends_on:
      transcription-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700"]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    environment:
      AGENT_TRANSCRIPTION_API_TOKEN_FILE: /runtime/token
      AGENT_TRANSCRIPTION_THREADS: ${AGENT_TRANSCRIPTION_THREADS:-2}
      AGENT_TRANSCRIPTION_MODEL_PATH: ${AGENT_TRANSCRIPTION_MODEL_PATH:-/models/ggml-small.bin}
    volumes:
      - whisper-models:/models:ro
      - transcription-runtime:/runtime:ro
    networks:
      - transcription_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  deep-research-agent:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_ROLE: deep-research-agent
    volumes:
      - ../data/share:/data/share
      - *postgres-tls-volume
      - *sandbox-tls-volume
      - *agent-config-volume
    networks:
      - database_net
      - model_net
      - clamav_net
      - egress_net
      - web_reader_control_net

  supervisor:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_ROLE: supervisor
    networks:
      - database_net
      - model_net
      - egress_net

  heartbeat:
    <<: *agent-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_ROLE: heartbeat
    networks:
      - database_net
      - model_net
      - clamav_net
      - egress_net
      - web_reader_control_net

  web-reader-gateway:
    profiles: ["web-reader"]
    build:
      context: .
      dockerfile: web_reader/Dockerfile
      target: gateway
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32
    depends_on:
      web-reader:
        condition: service_healthy
    networks:
      - web_reader_control_net
      - web_reader_browser_net
      - service_egress_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  web-reader:
    profiles: ["web-reader"]
    build:
      context: .
      dockerfile: web_reader/Dockerfile
      target: reader
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE", "SETUID", "SETGID", "CHOWN", "KILL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=384m,mode=1777
    shm_size: 256m
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    networks:
      - web_reader_browser_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 6

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ../data/ollama:/root/.ollama
    networks:
      - model_net
      - service_egress_net

  ollama-model-puller:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      AGENT_EMBEDDINGS_ENABLED: ${AGENT_EMBEDDINGS_ENABLED:-true}
      AGENT_EMBEDDINGS_MODEL: ${AGENT_EMBEDDINGS_MODEL:-embeddinggemma}
      AGENT_EMBEDDINGS_BASE_URL: ${AGENT_EMBEDDINGS_BASE_URL:-http://ollama:11434}
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        if [ "$$AGENT_EMBEDDINGS_ENABLED" != "true" ] || [ "$${AGENT_EMBEDDINGS_BASE_URL%/}" != "http://ollama:11434" ]; then
          echo "Managed model pull skipped: embeddings disabled or using a custom endpoint"
          exit 0
        fi
        attempt=1
        while [ "$$attempt" -le 60 ]; do
          if ollama list >/dev/null 2>&1; then
            exec ollama pull "$$AGENT_EMBEDDINGS_MODEL"
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        echo "Ollama did not become ready within 120 seconds" >&2
        exit 1
    networks:
      - model_net
      - egress_net

  # Production defaults for command execution:
  # - broker stays on sandbox_net only
  # - each command runs in a fresh container on its own bridge network
  # - run containers get the workspace, read-only harness docs, and HTTPS egress only via a
  #   per-run proxy sidecar that allows admin-approved hosts (SANDBOX_EGRESS_MODE=open restores direct internet)
  # Use a Compose override file to opt into gVisor/runsc after validating networking.
  sandbox-init:
    image: ${SANDBOX_IMAGE:-assistant-sandbox:latest}
    build: ./sandbox
    restart: "no"
    command: ["python", "bootstrap.py"]
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - type: bind
        source: ../data/private/tls/sandbox.crt
        target: /run/assistant/source/sandbox.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/private/tls/sandbox.key
        target: /run/assistant/source/sandbox.key
        read_only: true
        bind:
          create_host_path: false
      - sandbox-runtime:/run/assistant/runtime

  sandbox:
    image: ${SANDBOX_IMAGE:-assistant-sandbox:latest}
    build: ./sandbox
    restart: unless-stopped
    env_file:
      - path: ../data/overrides.env
        required: false
    depends_on:
      sandbox-init:
        condition: service_completed_successfully
    environment:
      SANDBOX_SHARED_ROOT: /data/share
      SANDBOX_SHARED_ROOT_HOST: ${SANDBOX_SHARED_ROOT_HOST:?Run ./run.sh first}
      SANDBOX_TLS_CERT_FILE: /run/assistant/runtime/current/sandbox.crt
      SANDBOX_TLS_KEY_FILE: /run/assistant/runtime/current/sandbox.key
      AGENT_SANDBOX_API_TOKEN_FILE: /run/assistant/runtime/current/AGENT_SANDBOX_API_TOKEN
      SANDBOX_ISOLATION_MODE: ${SANDBOX_ISOLATION_MODE:-container}
      SANDBOX_RUN_IMAGE: ${SANDBOX_IMAGE:-assistant-sandbox:latest}
      SANDBOX_RUN_NETWORK_MODE: ${SANDBOX_RUN_NETWORK_MODE:-per_run_bridge}
      SANDBOX_RUN_NETWORK: ${SANDBOX_RUN_NETWORK:-}
      SANDBOX_EGRESS_MODE: ${SANDBOX_EGRESS_MODE:-proxy}
      SANDBOX_RUN_CAP_DROP: ${SANDBOX_RUN_CAP_DROP:-NET_RAW}
      SANDBOX_RUN_CPUS: ${SANDBOX_RUN_CPUS:-2}
      SANDBOX_RUN_MEMORY_BYTES: ${SANDBOX_RUN_MEMORY_BYTES:-2147483648}
      SANDBOX_RUN_PIDS_LIMIT: ${SANDBOX_RUN_PIDS_LIMIT:-512}
      SANDBOX_DEFAULT_TIMEOUT_SECONDS: ${SANDBOX_DEFAULT_TIMEOUT_SECONDS:-300}
      SANDBOX_MAX_TIMEOUT_SECONDS: ${SANDBOX_MAX_TIMEOUT_SECONDS:-300}
      SANDBOX_PROXY_MEMORY_BYTES: ${SANDBOX_PROXY_MEMORY_BYTES:-268435456}
      EGRESS_PROXY_IDLE_TIMEOUT: ${EGRESS_PROXY_IDLE_TIMEOUT:-300}
      EGRESS_PROXY_MAX_CONNECTIONS: ${EGRESS_PROXY_MAX_CONNECTIONS:-64}
      SANDBOX_RUN_RUNTIME: ${SANDBOX_RUN_RUNTIME:-}
      SANDBOX_RUN_USER: ${SANDBOX_RUN_USER:-}
      SANDBOX_RUN_TMPFS_SIZE: ${SANDBOX_RUN_TMPFS_SIZE:-512m}
      SANDBOX_RUN_DNS_SERVERS: ${SANDBOX_RUN_DNS_SERVERS:-}
      SANDBOX_RUN_SECURITY_OPT: ${SANDBOX_RUN_SECURITY_OPT:-no-new-privileges:true}
      SANDBOX_RUN_CONTAINER_PREFIX: ${SANDBOX_RUN_CONTAINER_PREFIX:-assistant-sandbox-run}
      SANDBOX_RUN_NETWORK_PREFIX: ${SANDBOX_RUN_NETWORK_PREFIX:-assistant-sandbox-net}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,urllib.request; from pathlib import Path; root=Path('/run/assistant/runtime/current'); context=ssl.create_default_context(cafile=str(root/'sandbox.crt')); request=urllib.request.Request('https://sandbox:8080/health',headers={'Authorization':'Bearer '+(root/'AGENT_SANDBOX_API_TOKEN').read_text().strip()}); response=urllib.request.urlopen(request,context=context,timeout=4); assert response.status == 200"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    mem_limit: 2g
    cpus: 2
    volumes:
      - ../data/share:/data/share
      - sandbox-runtime:/run/assistant/runtime:ro
      # The Docker socket is required so the sandbox broker can create and
      # destroy ephemeral per-command containers for isolated execution.
      # This is a high-privilege mount — see docs/security.md for details.
      # To eliminate this exposure, set agent.sandbox.enabled: false in
      # config/agent.yaml (disables the command_execute tool entirely).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox_net

volumes:
  whisper-models:
  transcription-runtime:
  sandbox-runtime:

networks:
  management_net:
    internal: true
  management_access_net:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  transcription_net:
    internal: true
  database_net:
    internal: true
  model_net:
    internal: true
  clamav_net:
    internal: true
  egress_net:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  service_egress_net:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  sandbox_net:
    internal: true
  web_reader_control_net:
    internal: true
  web_reader_browser_net:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
